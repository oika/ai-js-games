<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ピクセルファイター</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            touch-action: none;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border: 3px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            max-width: 100vw;
            max-height: 100vh;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        #healthBar {
            width: 200px;
            height: 20px;
            background-color: #333;
            border: 2px solid #fff;
            margin-top: 5px;
        }
        #healthFill {
            height: 100%;
            background-color: #0f0;
            transition: width 0.3s;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            display: none;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            z-index: 20;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        #touchControls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            height: 120px;
            z-index: 15;
        }
        .touchButton {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .touchButton:active {
            background-color: rgba(255, 255, 255, 0.4);
        }
        #leftBtn, #rightBtn {
            width: 60px;
            height: 60px;
            bottom: 0;
        }
        #leftBtn {
            left: 20px;
        }
        #rightBtn {
            left: 90px;
        }
        #attackBtns {
            position: absolute;
            right: 20px;
            bottom: 0;
        }
        #punchBtn, #kickBtn, #specialBtn {
            width: 50px;
            height: 50px;
            position: absolute;
        }
        #punchBtn {
            right: 120px;
            bottom: 10px;
        }
        #kickBtn {
            right: 60px;
            bottom: 10px;
        }
        #specialBtn {
            right: 0;
            bottom: 10px;
        }
        @media (max-width: 768px) {
            #gameCanvas {
                width: 100vw !important;
                height: auto !important;
            }
            #controls {
                display: none;
            }
            #touchControls {
                display: block;
            }
            #ui {
                font-size: 14px;
            }
            #healthBar {
                width: 150px;
                height: 15px;
            }
            #gameOver {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui">
            <div>スコア: <span id="score">0</span></div>
            <div>体力:</div>
            <div id="healthBar">
                <div id="healthFill" style="width: 100%"></div>
            </div>
        </div>
        <div id="gameOver">
            <div>GAME OVER</div>
            <div style="font-size: 24px">スコア: <span id="finalScore">0</span></div>
            <div style="font-size: 18px">リロードして再挑戦</div>
        </div>
        <div id="controls">
            操作: ←→移動 Z:パンチ X:キック C:特殊攻撃
        </div>
        <div id="touchControls">
            <div id="leftBtn" class="touchButton">←</div>
            <div id="rightBtn" class="touchButton">→</div>
            <div id="attackBtns">
                <div id="punchBtn" class="touchButton">P</div>
                <div id="kickBtn" class="touchButton">K</div>
                <div id="specialBtn" class="touchButton">S</div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
